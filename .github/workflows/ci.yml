name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # tests expect it on 5433, like the local test cluster
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install "psycopg[binary]==3.3.9" duckdb==2.0.0 pytest==9.2.0
          which psql || sudo apt-get install -y postgresql-client
      - name: every query and every rewrite on a 20,000-ticket copy
        run: python -m pytest -q
